<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-label="Salon shampoo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dce8e1"/>
      <stop offset="100%" stop-color="#b7cfc3"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#e2ebe6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect x="250" y="90" width="140" height="40" rx="10" fill="#2f5a45"/>
  <rect x="220" y="130" width="200" height="520" rx="48" fill="url(#bottle)" stroke="#2f5a45" stroke-width="4"/>
  <rect x="250" y="280" width="140" height="180" rx="16" fill="#2f5a45"/>
  <text x="320" y="360" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="28" font-weight="700">SHAMPOO</text>
  <text x="320" y="400" text-anchor="middle" fill="#dce8e1" font-family="Arial, sans-serif" font-size="18">300ml</text>
  <circle cx="500" cy="160" r="48" fill="#ffffff55"/>
</svg>
