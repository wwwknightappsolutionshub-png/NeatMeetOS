  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect x="250" y="90" width="140" height="40" rx="10" fill="#6b5344"/>
  <rect x="220" y="130" width="200" height="520" rx="48" fill="url(#bottle)" stroke="#6b5344" stroke-width="4"/>
  <rect x="245" y="290" width="150" height="170" rx="16" fill="#6b5344"/>
  <text x="320" y="360" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="700">CONDITION</text>
